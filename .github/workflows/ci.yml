name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Citation and math tests
        run: |
          node tools/test-cite.mjs
          node tools/test-math.mjs
          node tools/test-fields.mjs
      - name: Build client bundle
        run: node tools/build.mjs
      - name: Syntax check
        run: |
          for file in index.js client.js src/host/*.js; do
            node --check "$file"
          done
      - name: Verify committed bundle is current
        run: git diff --exit-code -- client.js
